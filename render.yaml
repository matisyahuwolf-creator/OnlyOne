# Render blueprint: New > Blueprint, pick this repository. Then fill in the settings marked below.
services:
  - type: web
    name: only-one
    runtime: python
    plan: starter            # always on; the free plan sleeps and the first visitor waits about a minute
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.guide_server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY   # your key, typed into Render's settings
        sync: false
      - key: CLAUDE_MODEL        # the model that answers
        value: claude-opus-5-5
      - key: GUIDE_QUICK_MODEL   # the fast model for small calls
        value: claude-haiku-4-5
      - key: GUIDE_PUBLIC
        value: "1"
      - key: GUIDE_OWNER_CODE    # opens /guide/stats for you
        generateValue: true
