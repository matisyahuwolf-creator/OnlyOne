# Render blueprint: New > Blueprint, pick this repository. Then fill in the settings marked below.
services:
  - type: web
    name: only-one
    runtime: python
    plan: free               # a free demo: it sleeps when idle, and the first visitor waits about a minute (starter = always on, about $7 a month)
    buildCommand: pip install -r requirements.txt && python -m app.shelf
    startCommand: uvicorn app.guide_server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY   # your key, typed into Render's settings
        sync: false
      - key: CLAUDE_MODEL        # the model that answers
        value: claude-opus-5-5
      - key: GUIDE_QUICK_MODEL   # the fast model for small calls
        value: claude-haiku-4-5
      - key: GUIDE_PUBLIC
        value: "1"
      # demo limits, counted in replies: each visitor, and the whole site. Raise them when it's more than a demo.
      - key: GUIDE_REPLIES_PER_HOUR
        value: "20"
      - key: GUIDE_REPLIES_PER_DAY
        value: "40"
      - key: GUIDE_SITE_REPLIES_PER_DAY
        value: "200"
      - key: GUIDE_FEEDBACK_EMAIL  # where "Send this chat" emails a conversation the person chooses to send you
        sync: false
      - key: NEO4J_URI           # the library graph (neo4j+s://...databases.neo4j.io); with the two below, the chat can search everything
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: DATABASE_URL        # a Postgres that keeps the saved chats (e.g. a free Neon database); leave empty to save nothing
        sync: false
      - key: GUIDE_LOG_DAYS      # how long saved chats are kept
        value: "90"
      - key: GUIDE_OWNER_CODE    # opens /guide/chats and /guide/stats for you
        generateValue: true
